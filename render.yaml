services:
  # ============================================================
  # CacheForge Backend (C++ Storage Engine Core + Express API)
  # ============================================================
  - type: web
    name: cacheforge-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CACHEFORGE_BIN
        value: /app/build/cacheforge
      - key: CACHEFORGE_DATA_DIR
        value: /data/cacheforge
      - key: CORS_ORIGIN
        value: '*'

  # ============================================================
  # CacheForge Frontend (React 18 / Vite Developer Web UI)
  # ============================================================
  - type: static
    name: cacheforge-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cacheforge-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
